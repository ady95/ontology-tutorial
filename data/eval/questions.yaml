# 업무 질문 30개 — 책 전체의 평가 세트
#
# as_of: 모든 질문의 기준일(오늘)
# error_type: 기본 RAG(구성 1)에서 예상되는 주된 오류 유형
#   R = 검색 문제 (근거 문서를 못 찾거나 잘못 찾음)
#   D = 데이터 문제 (답에 필요한 정형 정보가 문서에 없음)
#   M = 의미 문제 (같은 용어가 다른 뜻, 개념 경계·준용 관계)
#   K = 규칙 문제 (조건·예외·시점 판단이 적용되지 않음)
#   "-" = 기본 RAG로도 답할 수 있어야 하는 기준선 질문
# key_facts: 채점 시 답변에 반드시 들어 있어야 하는 사실 (모두 포함 = 정답)
# evidence: 근거 조항 id (문서id:조항)
# needs_data: 정형 데이터 조회 없이는 답할 수 없는 질문
# expected_status: answer(결론) / hold(판단 보류·추가 확인)

