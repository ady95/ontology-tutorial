# 간이과세 기준 금액의 판 (10장 설계 데이터)
#
# 노트클라우드 rules.yaml 의 policy_versions 에 해당한다. 규정 문서 전체가 아니라
# "기준 금액"이라는 매개변수 하나의 판을 시행일 단위로 기록한다.
# 기준 연도 2025년. 확인 상태(verified)는 README.md 의 확인 결과 표와 같다.
#   verified: primary   — 국가법령정보센터 조문 페이지에서 확인
#             official  — 정부 보도자료·국세청 안내에서 확인
#             secondary — 세무 매체·세무사 해설에서만 확인 (확인 필요)
#             unverified — 확인하지 못함 (본문에 "확인 필요"로 표시)

parameter: simplified_taxation_threshold
unit: KRW
basis: 직전 연도(1역년) 공급대가 합계액 (부가가치세 포함)
comparison: 미달(미만). 기준 금액과 같으면 간이과세 아님
evidence_base: [vat_act:61.1, vat_decree:109.1]

versions:
  - id: threshold:v1
    amount: 48000000
    valid_from: null            # 확인 필요 — 간이과세 제도 개편(2000년) 이후 유지된 것으로 알려져 있으나 시행일 원문 미확인
    valid_to: 2021-06-30
    exceptions: []              # 모든 업종에 같은 금액이 적용되어 별도 예외가 없었음
    verified: secondary
    sources:
      - "세무 매체 해설 (2021-06) — 4,800만원에서 8,000만원으로 상향"

  - id: threshold:v2
    amount: 80000000
    valid_from: 2021-07-01
    valid_to: 2024-06-30
    exceptions:
      - {industries: [RealEstateRental, TaxableEntertainmentPlace], amount: 48000000, evidence: vat_act:61.1.3}
    verified: secondary         # 시행령 개정 2021-02-17, 2021-07-01 적용은 2차 자료로 확인
    sources:
      - "부가가치세법 61조 1항 개정 2020-12-22 (8천만원 ~ 8천만원의 130%의 범위에서 대통령령으로 정하는 금액)"
      - "시행령 109조 1항 개정 2021-02-17"
      - "세무 매체·세무사 해설 — 2021-07-01 이후 적용"

  - id: threshold:v3
    amount: 104000000
    valid_from: 2024-07-01
    valid_to: null              # 현행 (2025년 기준)
    exceptions:
      - {industries: [RealEstateRental, TaxableEntertainmentPlace], amount: 48000000, evidence: vat_act:61.1.3}
    verified: primary
    sources:
      - "시행령 109조 1항 개정 2024-02-29 — 1억4백만원 (국가법령정보센터 조문 확인)"
      - "대한민국 정책브리핑 2024-06 — 2024-07-01부터 적용, 부동산임대업·과세유흥장소는 4,800만원 유지 (https://www.korea.kr/news/policyNewsView.do?newsId=148930428)"
    related_changes:
      - "피부미용업·기타미용업의 면적 요건 폐지 (같은 시행일, 정책브리핑) — 배제 업종 목록의 변경"

# 판 선택 규칙 — 노트클라우드 version_selection 에 해당
version_selection:
  base: "판정 대상 적용기간의 개시일(7월 1일)에 시행 중인 판을 직전 연도 공급대가에 적용한다"
  example: "2025-07-01 ~ 2026-06-30 적용기간은 threshold:v3 를 2024년 공급대가에 적용"
  three_times:
    preceding_year: "공급대가를 집계하는 해 (사건 시점)"
    application_start: "적용기간이 시작하는 7월 1일 (규정 시점 — 어느 판인지 결정)"
    question_date: "질문이 들어온 날 (질문 시점 — 어느 적용기간이 현재인지 결정)"
  caution: "2024년 상반기에 들어온 질문은 threshold:v2 로 2023년 공급대가를, 2024-07-01 이후 질문은 threshold:v3 로 2023년 공급대가를 판정한다. 같은 직전 연도에 다른 판이 적용될 수 있다"
  verified: unverified       # 부칙의 적용례 원문을 확인하지 못함. 정책브리핑의 '2024-07-01부터 과세유형 전환 대상 확대'와 부합하는 것으로 추정

# 금액 무관 배제 업종 — 시행령 109조 2항 (판정 시 exceptions 보다 먼저 확인)
excluded_industries:
  evidence: vat_decree:109.2
  verified: partial            # 조문 페이지에서 각 호 요약만 확인. 2항이 2025-12-30 개정되어 2025년 시점 목록은 확인 필요
  items:
    - {no: 1, industry: 광업}
    - {no: 2, industry: 제조업, except: 최종소비자에게 직접 재화를 공급하는 사업 (국세청장 지정)}
    - {no: 3, industry: 도매업 및 상품중개업, except: 재생용 재료 수집·판매업}
    - {no: 4, industry: 부동산매매업}
    - {no: 5, industry: 과세유흥장소 중 시행규칙·국세청장 지정, note: 확인 필요}
    - {no: 6, industry: 특정 지역·규모의 부동산임대업, note: 확인 필요}
    - {no: 7, industry: 변호사·세무사·회계사·의사 등 전문직, note: 확인 필요}
    - {no: 8, industry: 일반과세자로부터 양수한 사업, note: 단서 조건 확인 필요}
    - {no: 9, industry: 사업장 소재지·종류·규모를 고려해 국세청장이 정하는 기준의 사업}
    - {no: 10, industry: 전전년도 기준 복식부기의무자가 경영하는 사업}
    - {no: 12, industry: 전기·가스·증기·수도 사업}
    - {no: 13, industry: 건설업, except: 최종소비자에게 직접 공급하는 사업}
    - {no: 14, industry: 전문·과학·기술 서비스업 및 사업시설관리·사업지원 서비스업, except: 최종소비자에게 직접 공급하는 사업}

# 신규·휴업·양수 사업자의 환산 — 시행령 109조 3항, 법 61조 2항
conversion:
  evidence: [vat_act:61.2, vat_decree:109.3]
  rule: "사업 개시일부터 과세기간 종료일까지의 공급대가를 12개월로 환산. 1개월 미만의 끝수는 1개월"
  verified: primary
