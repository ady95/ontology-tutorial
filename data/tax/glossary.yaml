# 세무 용어 사전 (10-2 산출물) — 간이과세 판단에 쓰이는 용어
#
# 형식은 data/ontology/glossary.yaml 과 같다. 다른 점은 surface_forms 의 각 항목에 layer 를 둔 것이다.
#   layer: law            법령 용어 — 법률·시행령·시행규칙의 조문에 쓰인 표현
#          interpretation 해석 용어 — 예규·판례·국세청 안내에 쓰인 표현 (이 파일에서는 국세청 공개 안내 수준만 반영, 개별 예규 인용 없음)
#          practice       실무 용어 — 상담 현장·납세자 발화·세무 매체에 쓰인 표현
# source 는 표현이 나온 곳. 조문은 조문 id (vat_act:61.1 등), 그 밖에는 설명.
#
# 기준 연도 2025년. 가상 사례용이며 실제 세무 판단의 근거로 쓰지 말 것.

terms:
  - canonical: SupplyConsideration
    label: 공급대가
    definition: 재화·용역의 공급에 대한 대가로서 부가가치세가 포함된 금액. 간이과세 기준 금액은 이 값으로 판단한다 (부가가치세법 61조 1항).
    surface_forms:
      - {form: 공급대가, layer: law, source: "vat_act:61.1"}
      - {form: 부가세 포함 매출, layer: practice, source: "상담 현장 — 공급대가를 풀어 말할 때"}
      - {form: 총매출, layer: practice, source: "납세자 발화 — 부가세 포함인지 불분명"}
      - {form: 연매출, layer: practice, source: "세무 매체 기사 — 기준 금액을 '연매출 1억 400만원'으로 쓰는 관행. 부가세 포함 여부가 생략됨"}
    confusable_with: [SupplyValue, Revenue]
    note: 납세자가 "매출"이라고 말하면 부가세 포함 여부를 확인하기 전에는 공급대가로 쓰지 않는다 (T03, T05).

  - canonical: SupplyValue
    label: 공급가액
    definition: 재화·용역의 공급에 대한 대가에서 부가가치세를 뺀 금액. 세금계산서에 적히고 과세표준이 된다 (부가가치세법 29조).
    surface_forms:
      - {form: 공급가액, layer: law, source: "vat_act:29"}
      - {form: 부가세 뺀 매출, layer: practice, source: "상담 현장"}
      - {form: 매출, layer: practice, source: "세금계산서·회계 장부 기준으로 말하는 사업자 — 공급가액을 뜻하는 경우가 많음"}
    confusable_with: [SupplyConsideration]
    note: 과세 매출만 있다면 공급대가 = 공급가액 × 1.1. 정부 보도자료조차 '직전 연도 공급가액 1억 400만원'처럼 두 용어를 섞어 쓰는 경우가 있어 문서 검색만으로는 구분이 안 된다.

  - canonical: Revenue
    label: 매출액(수입금액)
    definition: 사업에서 벌어들인 금액의 총칭. 소득세법은 "수입금액"이라 부르며 면세 매출을 포함한다. 부가가치세법의 공급대가·공급가액과 범위가 다르다.
    surface_forms:
      - {form: 수입금액, layer: law, source: "소득세법 — 복식부기의무 판정 등에 쓰임"}
      - {form: 매출액, layer: practice, source: "회계·납세자 발화"}
      - {form: 작년 매출, layer: practice, source: "납세자 발화 — 과세·면세, 부가세 포함 여부 모두 불분명"}
    confusable_with: [SupplyConsideration, SupplyValue]
    note: 간이과세 배제 사유 중 '전전년도 기준 복식부기의무자'(시행령 109조 2항)는 수입금액으로 판정하므로 한 질문 안에 두 기준이 함께 등장할 수 있다.

  - canonical: PrecedingYear
    label: 직전 연도
    definition: 판정 대상 적용기간의 전전 해가 아니라, 적용기간이 시작하는 해의 바로 전 1역년(1월 1일 ~ 12월 31일). 2025-07-01 시작 적용기간의 직전 연도는 2024년.
    surface_forms:
      - {form: 직전 연도, layer: law, source: "vat_act:61.1"}
      - {form: 1역년, layer: law, source: "vat_act:62.1"}
      - {form: 직전 과세기간, layer: law, source: "vat_act:61.2 — 신규 사업자 환산 조항"}
      - {form: 작년, layer: practice, source: "납세자 발화 — 질문 시점이 7월 이전이면 '작년'이 판정 기준 연도가 아닐 수 있음"}
    confusable_with: [TaxPeriod, ApplicationPeriod]
    note: 질문 시점이 2025년 3월이면 현재 적용기간(2024-07-01 ~ 2025-06-30)의 판정 연도는 2023년이다. "작년"을 그대로 직전 연도로 쓰면 틀린다.

  - canonical: ApplicationPeriod
    label: 적용기간
    definition: 간이과세 여부가 적용되는 기간. 직전 연도 공급대가가 기준에 미달하거나 이상이 되는 해의 다음 해 7월 1일부터 그 다음 해 6월 30일까지 (부가가치세법 62조).
    surface_forms:
      - {form: 적용기간, layer: law, source: "vat_act:62.1"}
      - {form: 과세유형 전환, layer: interpretation, source: "국세청 안내 — 7월 1일자 전환 통지"}
      - {form: 올해 7월부터, layer: practice, source: "납세자 발화"}
    confusable_with: [TaxPeriod]

  - canonical: TaxPeriod
    label: 과세기간
    definition: 부가가치세를 신고·납부하는 단위 기간. 간이과세자는 1월 1일 ~ 12월 31일, 일반과세자는 상·하반기.
    surface_forms:
      - {form: 과세기간, layer: law, source: "부가가치세법 5조"}
      - {form: 이번 부가세 기간, layer: practice, source: "납세자 발화 — 신고 기간과 혼동"}
    confusable_with: [ApplicationPeriod, PrecedingYear]
    note: 적용기간(7월~6월)과 과세기간(1월~12월)이 어긋나므로 "올해"가 어느 쪽인지 확인해야 한다.

  - canonical: NewBusiness
    label: 신규 사업자
    definition: 직전 과세기간 중에 새로 사업을 시작한 개인사업자. 개시일부터 과세기간 종료일까지의 공급대가를 12개월로 환산해 판정한다 (부가가치세법 61조 2항). 1개월 미만의 끝수는 1개월.
    surface_forms:
      - {form: 신규로 사업을 시작한 개인사업자, layer: law, source: "vat_act:61.2"}
      - {form: 신규 사업자, layer: interpretation, source: "국세청 안내"}
      - {form: 개업, layer: practice, source: "납세자 발화 — '개업일'이 등록일인지 영업 개시일인지 불분명"}
    confusable_with: [BusinessStartDate]

  - canonical: BusinessStartDate
    label: 사업 개시일
    definition: 사업을 시작한 날. 시행령 6조가 업종별 기준을 둔다(재화·용역 공급을 시작한 날 등). 12개월 환산의 기산일.
    surface_forms:
      - {form: 사업 개시일, layer: law, source: "vat_decree:6 — 조문 직접 확인하지 않음, 확인 필요"}
      - {form: 사업자등록일, layer: practice, source: "상담 현장 — 개시일 대신 쓰이는 경우가 많음"}
      - {form: 개업일, layer: practice, source: "납세자 발화"}
      - {form: 오픈한 날, layer: practice, source: "납세자 발화"}
    confusable_with: [NewBusiness]
    note: 등록일과 실제 공급 개시일이 해를 넘겨 갈라지면 해석 문제가 된다 (T10, 10-4의 I-02).

  - canonical: SimplifiedTaxpayer
    label: 간이과세자
    definition: 직전 연도 공급대가 합계가 기준 금액 미만이고 배제 사유가 없는 개인사업자. 법인은 해당 없음.
    surface_forms:
      - {form: 간이과세자, layer: law, source: "vat_act:61.1"}
      - {form: 간이, layer: practice, source: "상담 현장 줄임말"}
      - {form: 간이사업자, layer: practice, source: "납세자 발화"}
    confusable_with: [GeneralTaxpayer, ExemptBusiness]

  - canonical: GeneralTaxpayer
    label: 일반과세자
    definition: 간이과세가 적용되지 않는 과세사업자. 세금계산서 발급 의무와 매입세액 공제 방식이 간이과세자와 다르다.
    surface_forms:
      - {form: 일반과세자, layer: law, source: "부가가치세법"}
      - {form: 일반, layer: practice, source: "상담 현장 줄임말"}
    confusable_with: [SimplifiedTaxpayer]

  - canonical: ExemptBusiness
    label: 면세사업자
    definition: 부가가치세가 면제되는 재화·용역만 공급하는 사업자. 간이·일반 구분과 다른 축이다. 면세 매출은 공급대가 합계에 들어가지 않는다.
    surface_forms:
      - {form: 면세사업자, layer: law, source: "부가가치세법 26조 등"}
      - {form: 세금 안 내는 사업자, layer: practice, source: "납세자 발화 — 납부의무 면제 간이과세자와 혼동"}
    confusable_with: [SimplifiedTaxpayer, PaymentExemptSimplifiedTaxpayer]
    note: 과세·면세 겸업이면 과세 부분의 공급대가만으로 판정한다. 납세자의 "매출"에 면세분이 섞였는지 확인해야 한다.

  - canonical: PaymentExemptSimplifiedTaxpayer
    label: 납부의무 면제 간이과세자
    definition: 간이과세자 중 해당 과세기간 공급대가가 4,800만원 미만이어서 납부의무가 면제되는 사업자. 간이과세 적용 여부와는 별개의 기준.
    surface_forms:
      - {form: 납부의무의 면제, layer: law, source: "부가가치세법 69조 — 조문 직접 확인하지 않음"}
      - {form: 부가세 안 내는 간이, layer: practice, source: "상담 현장"}
    confusable_with: [ExemptBusiness, SimplifiedTaxpayer]
    note: 4,800만원이라는 숫자가 부동산임대업 예외 기준(61조 1항 3호)과 같아서 두 규정이 자주 섞인다. 같은 숫자, 다른 규정.

  - canonical: BusinessPlace
    label: 사업장
    definition: 사업자가 사업을 하는 장소 단위. 사업자등록은 사업장마다 한다. 둘 이상 사업장의 공급대가는 합산해 기준 금액과 비교한다 (61조 1항 4호).
    surface_forms:
      - {form: 사업장, layer: law, source: "vat_act:61.1.4"}
      - {form: 사업자 하나 더 냈다, layer: practice, source: "납세자 발화 — 사업장 추가를 뜻함"}
      - {form: 가게, layer: practice, source: "납세자 발화"}
    confusable_with: [Businessperson]

  - canonical: Businessperson
    label: 사업자
    definition: 부가가치세 납세의무가 있는 사람 또는 법인. 간이과세는 개인사업자에게만 적용된다.
    surface_forms:
      - {form: 사업자, layer: law, source: "부가가치세법 2조"}
      - {form: 개인사업자, layer: law, source: "vat_act:61.1"}
      - {form: 사업자, layer: practice, source: "납세자 발화 — 사업장(사업자등록증)을 뜻하는 경우가 많음"}
    confusable_with: [BusinessPlace]
    note: 같은 단어 '사업자'가 법령에서는 사람, 발화에서는 사업장을 가리킨다.

  - canonical: RealEstateRental
    label: 부동산임대업
    definition: 부동산을 빌려주고 대가를 받는 업종. 해당 업종의 직전 연도 공급대가가 4,800만원 이상이면 간이과세에서 제외된다 (61조 1항 3호). 일부 지역·규모는 시행령으로 별도 배제.
    surface_forms:
      - {form: 부동산임대업, layer: law, source: "vat_act:61.1.3"}
      - {form: 임대, layer: practice, source: "납세자 발화 — 주택임대(면세)와 상가임대(과세)를 구분하지 않음"}
      - {form: 세놓는다, layer: practice, source: "납세자 발화"}
    confusable_with: [ExcludedIndustry]
    note: 주택임대는 대체로 면세라 공급대가에 들어가지 않는다. "임대"가 상가인지 주택인지 확인해야 한다.

  - canonical: TaxableEntertainmentPlace
    label: 과세유흥장소
    definition: 개별소비세법상 과세유흥장소. 부동산임대업과 같이 4,800만원 기준이 적용된다 (61조 1항 3호).
    surface_forms:
      - {form: 과세유흥장소, layer: law, source: "vat_act:61.1.3"}
      - {form: 유흥업소, layer: practice, source: "납세자 발화"}
    confusable_with: [ExcludedIndustry]

  - canonical: ExcludedIndustry
    label: 간이과세 배제 업종
    definition: 규모와 관계없이 간이과세가 적용되지 않는 업종. 시행령 109조 2항(광업, 제조업, 도매업·상품중개업, 부동산매매업, 전문직 등). 2025-12-30 개정이 있어 2025년 시점 목록은 확인 필요.
    surface_forms:
      - {form: 대통령령으로 정하는 사업자, layer: law, source: "vat_act:61.1.2"}
      - {form: 간이과세 배제 업종, layer: interpretation, source: "국세청 안내"}
      - {form: 간이 안 되는 업종, layer: practice, source: "상담 현장"}
    confusable_with: [RealEstateRental, TaxableEntertainmentPlace]
    note: 4,800만원 기준이 붙는 업종(임대·유흥)과 금액 무관 배제 업종을 한 목록에 두면 T04와 T08의 답이 뒤섞인다.

  - canonical: ThresholdAmount
    label: 기준 금액
    definition: 간이과세 적용 여부를 가르는 직전 연도 공급대가 합계의 상한. 시점에 따라 4,800만원 → 8,000만원 → 1억 400만원. 판은 policy_versions.yaml.
    surface_forms:
      - {form: 대통령령으로 정하는 금액, layer: law, source: "vat_act:61.1"}
      - {form: 1억 4백만원, layer: law, source: "vat_decree:109.1"}
      - {form: 간이과세 기준, layer: practice, source: "세무 매체·납세자 발화"}
    note: 조문은 "미달"(미만)이다. 기준 금액과 정확히 같으면 간이과세가 아니다 (T06의 환산액 8,000만원 예).
