# 노트클라우드 최소 의미 모델 (04-5 산출물)
# 업무 질문 30개에서 뽑아낸 개념 14개, 관계 13개.
# 이 파일이 6장에서 PostgreSQL 스키마로, 7장에서 LLM 컨텍스트로 옮겨집니다.

concepts:
  - id: Customer
    label: 고객
    definition: 노트클라우드와 구독 계약을 맺은 주체. 개인 또는 팀(조직).
    attributes: [customer_type, is_student, account_status]
    subtypes: [IndividualCustomer, TeamCustomer]

  - id: TeamMember
    label: 팀 구성원
    definition: 팀 고객에 속한 사용자 계정. 역할은 관리자 또는 구성원.
    attributes: [role]

  - id: Plan
    label: 요금제
    definition: 기능·가격·대상이 정해진 상품. 베이직·프로·팀·학생.
    attributes: [monthly_price, yearly_price, min_seats, target]

  - id: Subscription
    label: 구독
    definition: 고객이 특정 요금제를 특정 결제 주기로 이용하는 계약. 결제 완료 시점에 성립한다.
    attributes: [billing_cycle, seats, status, promo_code, current_period_start, current_period_end]
    states: [active, cancel_scheduled, ended]

  - id: Payment
    label: 결제
    definition: 구독 한 주기에 대한 대금 지불. 결제 완료일이 규정 적용과 환불 기간 계산의 기준일이다.
    attributes: [paid_at, amount, list_price, promo_code, is_renewal]

  - id: Usage
    label: 사용량
    definition: 한 결제 주기 동안의 문서 생성 수와 로그인 횟수. "미사용" 판정의 근거.
    attributes: [docs_created, logins]

  - id: Incident
    label: 서비스 중단
    definition: 서비스가 이용 불가능했던 사건. 회사 책임 장애와 공지된 정기 점검을 구분한다.
    attributes: [started_at, ended_at, duration_hours, responsibility, is_planned_maintenance]
    subtypes: [Outage, PlannedMaintenance]

  - id: Credit
    label: 크레딧
    definition: 장애 보상으로 지급되어 다음 결제에서 차감되는 금액. 현금이 아니다.
    attributes: [amount, reason]

  - id: CustomerRequest
    label: 고객 요청
    definition: 고객이 구독에 대해 요구하는 행위. 종류에 따라 적용 규정과 결과가 다르다.
    subtypes: [RefundRequest, CancellationRequest, PaymentReversalRequest, SeatChangeRequest]
    attributes: [requested_at, requested_by]

  - id: RefundRequest
    label: 환불 요청
    definition: 이미 결제된 금액의 전부 또는 일부 반환 요구. 환불 규정이 적용된다.

  - id: CancellationRequest
    label: 해지 요청
    definition: 다음 결제 주기부터 갱신하지 않겠다는 의사 표시. 금액 반환이 없다.

  - id: PaymentReversalRequest
    label: 결제 취소 요청
    definition: 결제 완료 후 24시간 이내의 결제 철회. 환불 규정이 적용되지 않는다.

  - id: PolicyVersion
    label: 규정 판
    definition: 특정 기간에 유효한 규정 문서의 한 판. 유효기간을 가진다.
    attributes: [doc_id, title, valid_from, valid_to]

  - id: Clause
    label: 조항
    definition: 규정 판 안의 조·항 단위 규정 텍스트. 답변의 근거 단위.
    attributes: [clause_no, text]

  - id: ApprovalAuthority
    label: 승인 권한
    definition: 환불 금액 구간별로 승인할 수 있는 직책.
    attributes: [min_amount, max_amount, approver]

relations:
  - id: has_subscription
    label: 구독한다
    from: Customer
    to: Subscription
    cardinality: 1..n

  - id: member_of
    label: 소속된다
    from: TeamMember
    to: Customer
    cardinality: n..1
    note: 팀 고객에만 해당

  - id: subscribes_plan
    label: 요금제를 따른다
    from: Subscription
    to: Plan
    cardinality: n..1

  - id: paid_by
    label: 결제된다
    from: Subscription
    to: Payment
    cardinality: 1..n

  - id: has_usage
    label: 사용량을 가진다
    from: Subscription
    to: Usage
    cardinality: 1..n
    note: 결제 주기마다 하나. 없으면 "미확인"이지 "미사용"이 아니다

  - id: governed_by
    label: 적용 규정 판
    from: Payment
    to: PolicyVersion
    cardinality: n..1
    derived: "payment.paid_at BETWEEN policy.valid_from AND policy.valid_to"
    note: 결제 완료일 기준. 약관 9조 3항의 유리한 규정 적용은 별도 규칙(rules.yaml)

  - id: part_of
    label: 속한다
    from: Clause
    to: PolicyVersion
    cardinality: n..1

  - id: supersedes
    label: 대체한다
    from: Clause
    to: Clause
    note: 제2판 4조 1항은 제1판 3조 1항을 대체

  - id: applies_mutatis_mutandis
    label: 준용한다
    from: Clause
    to: Clause
    note: 제2판 6조 1항(학생) → 3조·4조(베이직 규정)

  - id: governs
    label: 규율한다
    from: Clause
    to: CustomerRequest
    note: 조항이 어떤 종류의 요청을 다루는지

  - id: cites
    label: 인용한다
    from: Clause
    to: Clause
    note: FAQ·운영 매뉴얼 항목이 근거로 삼는 규정 조항. 규정이 바뀌면 인용하는 쪽을 재점검한다

  - id: affected_by
    label: 영향받는다
    from: Subscription
    to: Incident
    derived: "incident 기간이 subscription 의 결제 주기와 겹침"

  - id: requested_by
    label: 요청자
    from: CustomerRequest
    to: TeamMember
    note: 팀 고객의 요청은 관리자 역할만 유효
